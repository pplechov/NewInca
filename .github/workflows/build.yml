name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pillow numpy
      - name: Build
        run: python build.py
      - name: Smoke test
        run: python src/main.py --version
      - uses: actions/upload-artifact@v4
        with:
          name: newINCA-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15          # Apple Silicon (arm64); macos-14 is not offered here
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pillow numpy
      - name: Build
        run: python build.py
      - name: Smoke test
        run: |
          python src/main.py --version
          ./dist/newINCA.app/Contents/MacOS/newINCA profiles
      - uses: actions/upload-artifact@v4
        with:
          name: newINCA-macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "newINCA $GITHUB_REF_NAME" --generate-notes
